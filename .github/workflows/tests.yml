# Runs the test suite (npm test) on every push and pull request.
name: Tests

on:
  push:
  pull_request:

# Read-only token: the job only checks out the code and runs the tests.
permissions:
  contents: read

jobs:
  test:
    # The app is Windows-only: test where it runs (paths, line endings).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The tests don't need the Electron binary (about 100 MB).
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
