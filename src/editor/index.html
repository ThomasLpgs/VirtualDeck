<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' file: data:; media-src file:"
    />
    <title>VirtualDeck</title>
    <link rel="stylesheet" href="../shared/keys.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body class="i18n-pending">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark"><span id="brand-glyph"></span></span>
        <span class="brand-name">VirtualDeck</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" data-view="buttons" data-i18n="tab.buttons"></button>
        <button class="tab" type="button" role="tab" data-view="connection" data-i18n="tab.connection"></button>
        <button class="tab" type="button" role="tab" data-view="settings" data-i18n="tab.settings"></button>
      </nav>
      <div class="titlebar-right">
        <span id="save-status" class="save-status" aria-live="polite"></span>
        <button id="update-pill" class="pill update" type="button" hidden>
          <span id="update-glyph"></span><span id="update-pill-text"></span>
        </button>
        <button id="stream-pill" class="pill" type="button">
          <span class="status-dot"></span><span id="stream-pill-text"></span>
        </button>
      </div>
    </header>

    <!-- ===================== Buttons ===================== -->
    <main id="view-buttons" class="view view-buttons">
      <section class="canvas">
        <div class="canvas-inner">
          <nav id="page-tabs" class="page-tabs"></nav>
          <div class="deck-panel preview-panel">
            <header class="deck-header">
              <span id="preview-status" class="deck-status"></span>
              <kbd id="preview-hotkey"></kbd>
            </header>
            <div id="preview" class="keys preview"></div>
          </div>

          <div class="canvas-toolbar">
            <div class="stepper" data-axis="cols">
              <span class="stepper-label" data-i18n="grid.columns"></span>
              <button type="button" data-step="-1" data-i18n-aria-label="grid.removeColumn">−</button>
              <output id="cols-value"></output>
              <button type="button" data-step="1" data-i18n-aria-label="grid.addColumn">+</button>
            </div>
            <div class="stepper" data-axis="rows">
              <span class="stepper-label" data-i18n="grid.rows"></span>
              <button type="button" data-step="-1" data-i18n-aria-label="grid.removeRow">−</button>
              <output id="rows-value"></output>
              <button type="button" data-step="1" data-i18n-aria-label="grid.addRow">+</button>
            </div>
            <label id="page-name-field" class="stepper page-name" hidden>
              <span class="stepper-label" data-i18n="page.name"></span>
              <input id="page-name" type="text" maxlength="30" spellcheck="false" />
            </label>
          </div>
          <p class="canvas-hint" data-i18n="grid.hint"></p>
        </div>
      </section>

      <aside class="inspector">
        <div class="inspector-head">
          <div>
            <p id="button-number" class="eyebrow"></p>
            <h2 id="button-title"></h2>
          </div>
          <button id="clear-button" class="icon-btn danger" type="button" data-i18n-title="editor.clearButton"></button>
        </div>

        <section class="group">
          <h3 data-i18n="editor.appearance"></h3>
          <div class="field">
            <label for="label" data-i18n="editor.text"></label>
            <input id="label" maxlength="40" data-i18n-placeholder="editor.textPlaceholder" />
          </div>

          <div class="field">
            <label for="icon-search" data-i18n="editor.icon"></label>
            <div class="icon-picker">
              <div class="search">
                <span id="search-glyph"></span>
                <input id="icon-search" type="search" data-i18n-placeholder="editor.iconSearch" />
              </div>
              <div id="icon-grid" class="icon-grid" role="listbox" data-i18n-aria-label="editor.icon"></div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="emoji" data-i18n="editor.emoji"></label>
              <input id="emoji" maxlength="8" data-i18n-placeholder="common.none" />
            </div>
            <div class="field">
              <label data-i18n="editor.image"></label>
              <div class="inline">
                <button id="image-pick" class="btn" type="button"></button>
                <button id="image-clear" class="btn ghost" type="button" data-i18n="common.remove" hidden></button>
              </div>
            </div>
          </div>

          <div class="field">
            <label data-i18n="editor.color"></label>
            <div id="swatches" class="swatches"></div>
          </div>
        </section>

        <section class="group">
          <h3 data-i18n="editor.action"></h3>
          <div id="action-tiles" class="action-tiles" role="radiogroup" data-i18n-aria-label="editor.action"></div>
          <div id="action-fields" class="action-fields"></div>
        </section>
      </aside>
    </main>

    <!-- ===================== Connection ===================== -->
    <main id="view-connection" class="view view-page" hidden>
      <div class="page">
        <header class="page-head">
          <h1 data-i18n="conn.title"></h1>
          <p data-i18n="conn.subtitle"></p>
        </header>

        <div id="software-switch" class="software-switch" role="radiogroup" data-i18n-aria-label="conn.software">
          <button type="button" data-software="obs">
            <strong>OBS Studio</strong><span data-i18n="conn.obsHint"></span>
          </button>
          <button type="button" data-software="streamlabs">
            <strong>Streamlabs Desktop</strong><span data-i18n="conn.streamlabsHint"></span>
          </button>
        </div>

        <section class="card connection">
          <div class="connection-status">
            <span id="conn-big-status" class="big-status"><span class="status-dot"></span><span id="conn-big-text"></span></span>
            <p id="conn-detail" class="muted"></p>
          </div>
          <div class="field-row">
            <div class="field grow">
              <label for="conn-url" data-i18n="conn.address"></label>
              <input id="conn-url" spellcheck="false" />
            </div>
            <div class="field grow">
              <label for="conn-secret" id="conn-secret-label"></label>
              <input id="conn-secret" type="password" autocomplete="off" />
            </div>
          </div>
          <div class="inline end">
            <button id="conn-connect" class="btn primary" type="button" data-i18n="conn.connect"></button>
          </div>
        </section>

        <section data-guide="obs">
          <h2 class="section-title" data-i18n="guide.obs.title"></h2>
          <ol class="steps">
            <li class="step"><h3 data-i18n="guide.obs.s1.title"></h3><p data-i18n-html="guide.obs.s1.body"></p></li>
            <li class="step"><h3 data-i18n="guide.obs.s2.title"></h3><p data-i18n-html="guide.obs.s2.body"></p></li>
            <li class="step"><h3 data-i18n="guide.obs.s3.title"></h3><p data-i18n-html="guide.obs.s3.body"></p></li>
            <li class="step"><h3 data-i18n="guide.connect.title"></h3><p data-i18n-html="guide.connect.body"></p></li>
          </ol>
        </section>

        <section data-guide="streamlabs">
          <h2 class="section-title" data-i18n="guide.sl.title"></h2>
          <ol class="steps">
            <li class="step"><h3 data-i18n="guide.sl.s1.title"></h3><p data-i18n-html="guide.sl.s1.body"></p></li>
            <li class="step"><h3 data-i18n="guide.sl.s2.title"></h3><p data-i18n-html="guide.sl.s2.body"></p></li>
            <li class="step"><h3 data-i18n="guide.sl.s3.title"></h3><p data-i18n-html="guide.sl.s3.body"></p></li>
            <li class="step"><h3 data-i18n="guide.connect.title"></h3><p data-i18n-html="guide.connect.body"></p></li>
          </ol>
        </section>

        <h2 class="section-title" data-i18n="guide.anim.title"></h2>
        <ol class="steps">
          <li class="step"><h3 data-i18n="guide.anim.s1.title"></h3><p data-i18n-html="guide.anim.s1.body"></p></li>
          <li class="step"><h3 data-i18n="guide.anim.s2.title"></h3><p data-i18n-html="guide.anim.s2.body"></p></li>
          <li class="step"><h3 data-i18n="guide.anim.s3.title"></h3><p data-i18n-html="guide.anim.s3.body"></p></li>
        </ol>

        <h2 class="section-title" data-i18n="faq.title"></h2>
        <div class="faq">
          <details><summary data-i18n="faq.offline.q"></summary><p data-i18n-html="faq.offline.a"></p></details>
          <details><summary data-i18n="faq.auth.q"></summary><p data-i18n-html="faq.auth.a"></p></details>
          <details><summary data-i18n="faq.remote.q"></summary><p data-i18n-html="faq.remote.a"></p></details>
          <details><summary data-i18n="faq.scene.q"></summary><p data-i18n-html="faq.scene.a"></p></details>
        </div>
      </div>
    </main>

    <!-- ===================== Settings ===================== -->
    <main id="view-settings" class="view view-page" hidden>
      <div class="page">
        <header class="page-head">
          <h1 data-i18n="tab.settings"></h1>
        </header>

        <section class="card rows">
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.language"></p>
              <p class="muted" data-i18n="settings.languageHint"></p>
            </div>
            <div id="language-select"></div>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.hotkey"></p>
              <p id="hotkey-hint" class="muted" data-i18n="settings.hotkeyHint"></p>
            </div>
            <button id="hotkey" class="hotkey" type="button"></button>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.closeAfter"></p>
              <p class="muted" data-i18n="settings.closeAfterHint"></p>
            </div>
            <label class="switch"><input type="checkbox" id="close-after" /><span></span></label>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.login"></p>
              <p class="muted" data-i18n="settings.loginHint"></p>
            </div>
            <label class="switch"><input type="checkbox" id="login" /><span></span></label>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.deckPosition"></p>
              <p id="deck-position-hint" class="muted"></p>
            </div>
            <button id="deck-position-reset" class="btn" type="button" data-i18n="settings.deckPositionReset"></button>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.deckScale"></p>
              <p class="muted" data-i18n="settings.deckScaleHint"></p>
            </div>
            <div class="inline">
              <input id="deck-scale" type="range" min="60" max="160" step="5" />
              <span id="deck-scale-value" class="range-value"></span>
              <button id="deck-scale-reset" class="btn" type="button" data-i18n="settings.deckScaleReset"></button>
            </div>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="settings.pageMode"></p>
              <p class="muted" data-i18n="settings.pageModeHint"></p>
            </div>
            <div id="page-mode"></div>
          </div>
        </section>

        <h2 class="section-title" data-i18n="phone.title"></h2>
        <section class="card rows">
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="phone.enable"></p>
              <p class="muted" data-i18n="phone.enableHint"></p>
            </div>
            <label class="switch"><input type="checkbox" id="phone-enabled" /><span></span></label>
          </div>
          <div id="phone-details" class="setting-group" hidden>
            <div class="setting">
              <div class="setting-text">
                <p id="phone-status" class="setting-title"></p>
                <p id="phone-phones" class="muted"></p>
              </div>
              <button id="phone-qr-toggle" class="btn" type="button"></button>
            </div>
            <div id="phone-qr" class="setting phone-qr" hidden>
              <img id="phone-qr-img" alt="" width="180" height="180" />
              <div class="setting-text">
                <p class="muted" data-i18n="phone.qrHint"></p>
                <p class="muted" data-i18n="phone.qrWarning"></p>
                <p class="muted" data-i18n="phone.firewallHint"></p>
              </div>
            </div>
            <div class="setting">
              <div class="setting-text">
                <p class="setting-title" data-i18n="phone.maxPhones"></p>
                <p id="phone-max-hint" class="muted"></p>
              </div>
              <div id="phone-max"></div>
            </div>
            <div class="setting">
              <div class="setting-text">
                <p class="setting-title" data-i18n="phone.newKey"></p>
                <p class="muted" data-i18n="phone.newKeyHint"></p>
              </div>
              <button id="phone-new-key" class="btn" type="button" data-i18n="phone.newKeyButton"></button>
            </div>
          </div>
        </section>

        <h2 class="section-title" data-i18n="hue.title"></h2>
        <section id="hue-card" class="card rows"></section>

        <h2 class="section-title" data-i18n="backup.title"></h2>
        <section class="card rows">
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="backup.export"></p>
              <p class="muted" data-i18n="backup.exportHint"></p>
            </div>
            <button id="export-config" class="btn" type="button" data-i18n="backup.exportButton"></button>
          </div>
          <div class="setting">
            <div class="setting-text">
              <p class="setting-title" data-i18n="backup.import"></p>
              <p class="muted" data-i18n="backup.importHint"></p>
            </div>
            <button id="import-config" class="btn" type="button" data-i18n="backup.importButton"></button>
          </div>
          <p id="backup-status" class="backup-status" aria-live="polite" hidden></p>
        </section>
      </div>
    </main>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/keys.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
