<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>VirtualDeck</title>
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="shared/keys.css" />
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body class="i18n-pending">
    <header class="deck-header phone-header">
      <span id="deck-status" class="deck-status"></span>
      <span id="pager" class="pager" hidden>
        <button id="page-prev" class="icon-btn" type="button" data-i18n-aria-label="page.prev"></button>
        <span id="page-label"></span>
        <button id="page-next" class="icon-btn" type="button" data-i18n-aria-label="page.next"></button>
      </span>
    </header>
    <main id="stage" class="stage">
      <div id="grid" class="keys"></div>
    </main>

    <!-- Not paired (no key, or a key the PC replaced): scan the QR code again. -->
    <section id="pair" class="overlay" hidden>
      <img src="icon.png" alt="" width="64" height="64" />
      <h1 id="pair-title" data-i18n="phone.pairTitle"></h1>
      <p id="pair-hint" data-i18n="phone.pairHint"></p>
    </section>

    <p id="banner" class="banner" hidden></p>
    <p id="toast" class="toast" hidden></p>

    <script src="shared/i18n.js"></script>
    <script src="shared/keys.js"></script>
    <script src="shared/hmac.js"></script>
    <script src="phone.js"></script>
  </body>
</html>
