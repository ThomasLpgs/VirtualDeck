<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' file: data:; media-src file:"
    />
    <title>VirtualDeck</title>
    <link rel="stylesheet" href="../shared/keys.css" />
    <link rel="stylesheet" href="deck.css" />
  </head>
  <body class="i18n-pending">
    <main id="panel" class="deck-panel">
      <header class="deck-header">
        <span id="popup-title" class="popup-title" hidden>
          <button id="popup-back" class="deck-icon-btn" type="button" data-i18n-title="deck.back"></button>
          <span id="popup-label"></span>
        </span>
        <span id="deck-status" class="deck-status"></span>
        <span class="deck-actions">
          <span id="pager" class="pager" hidden>
            <button id="page-prev" class="deck-icon-btn" type="button" data-i18n-title="page.prev"></button>
            <span id="page-label"></span>
            <button id="page-next" class="deck-icon-btn" type="button" data-i18n-title="page.next"></button>
          </span>
          <kbd data-i18n="key.Escape"></kbd>
          <button id="open-editor" class="deck-icon-btn" type="button" data-i18n-title="deck.configure"></button>
          <button id="close-deck" class="deck-icon-btn close-btn" type="button" data-i18n-title="deck.close"></button>
        </span>
      </header>
      <div id="grid" class="keys"></div>
      <div id="resize-grip" class="resize-grip" data-i18n-title="deck.resize"></div>
      <!-- Pointer of a popup page, reaching into the key that opened it. -->
      <div id="tail" class="tail" hidden></div>
    </main>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/keys.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
